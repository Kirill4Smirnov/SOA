services:
  booking-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "15432:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d bookings"]
      interval: 3s
      timeout: 3s
      retries: 20

  flight-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flights
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight
    ports:
      - "15433:5432"
    volumes:
      - flight-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight -d flights"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-master:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-master-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-replica:
    image: redis:7.4-alpine
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    depends_on:
      redis-master:
        condition: service_healthy
    volumes:
      - redis-replica-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-sentinel:
    image: redis:7.4-alpine
    command: ["sh", "-c", "cp /sentinel-source/sentinel.conf /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf"]
    ports:
      - "26379:26379"
    volumes:
      - ./redis/sentinel.conf:/sentinel-source/sentinel.conf:ro
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  flight-service:
    build:
      context: .
      dockerfile: flight-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://flight-db:5432/flights
      DB_USER: flight
      DB_PASSWORD: flight
      GRPC_PORT: 9090
      HTTP_PORT: 8081
      FLIGHT_GRPC_API_KEY: ${FLIGHT_GRPC_API_KEY:-development-secret}
      REDIS_SENTINEL_MASTER: mymaster
      REDIS_SENTINEL_NODES: redis-sentinel:26379
      FLIGHT_CACHE_TTL: ${FLIGHT_CACHE_TTL:-10m}
    ports:
      - "8081:8081"
      - "9090:9090"
    depends_on:
      flight-db:
        condition: service_healthy
      redis-sentinel:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 30

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://booking-db:5432/bookings
      DB_USER: booking
      DB_PASSWORD: booking
      HTTP_PORT: 8080
      FLIGHT_GRPC_HOST: flight-service
      FLIGHT_GRPC_PORT: 9090
      FLIGHT_GRPC_API_KEY: ${FLIGHT_GRPC_API_KEY:-development-secret}
      GRPC_RETRY_MAX_ATTEMPTS: ${GRPC_RETRY_MAX_ATTEMPTS:-3}
      GRPC_RETRY_INITIAL_BACKOFF: ${GRPC_RETRY_INITIAL_BACKOFF:-100ms}
      FLIGHT_GRPC_DEADLINE: ${FLIGHT_GRPC_DEADLINE:-2s}
      CB_FAILURE_THRESHOLD: ${CB_FAILURE_THRESHOLD:-5}
      CB_OPEN_TIMEOUT: ${CB_OPEN_TIMEOUT:-15s}
      CB_WINDOW_SIZE: ${CB_WINDOW_SIZE:-10}
    ports:
      - "8080:8080"
    depends_on:
      booking-db:
        condition: service_healthy
      flight-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  booking-db-data:
  flight-db-data:
  redis-master-data:
  redis-replica-data:
