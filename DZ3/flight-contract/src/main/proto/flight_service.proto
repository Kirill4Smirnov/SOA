syntax = "proto3";

package flight.v1;

option java_multiple_files = true;
option java_package = "ru.soa.flight.contract.v1";
option java_outer_classname = "FlightServiceProto";

import "google/protobuf/timestamp.proto";

service FlightService {
  // INVALID_ARGUMENT; returns only SCHEDULED flights.
  rpc SearchFlights(SearchFlightsRequest) returns (SearchFlightsResponse);
  // NOT_FOUND when flight_id does not exist.
  rpc GetFlight(GetFlightRequest) returns (Flight);
  // NOT_FOUND, FAILED_PRECONDITION, RESOURCE_EXHAUSTED, ALREADY_EXISTS.
  // Idempotent for the same booking_id, flight_id and seat_count.
  rpc ReserveSeats(ReserveSeatsRequest) returns (SeatReservation);
  // NOT_FOUND when booking_id has no reservation; repeated release is idempotent.
  rpc ReleaseReservation(ReleaseReservationRequest) returns (SeatReservation);
  // NOT_FOUND or INVALID_ARGUMENT.
  rpc UpdateFlight(UpdateFlightRequest) returns (Flight);
}

enum FlightStatus {
  FLIGHT_STATUS_UNSPECIFIED = 0;
  SCHEDULED = 1;
  DEPARTED = 2;
  CANCELLED = 3;
  COMPLETED = 4;
}

enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  RELEASED = 2;
  EXPIRED = 3;
}

message Flight {
  string id = 1;
  string flight_number = 2;
  string airline_code = 3;
  string airline_name = 4;
  string origin = 5;
  string destination = 6;
  google.protobuf.Timestamp departure_time = 7;
  google.protobuf.Timestamp arrival_time = 8;
  int32 total_seats = 9;
  int32 available_seats = 10;
  string price = 11;
  FlightStatus status = 12;
}

message SearchFlightsRequest {
  string origin = 1;
  string destination = 2;
  optional google.protobuf.Timestamp departure_date = 3;
}

message SearchFlightsResponse {
  repeated Flight flights = 1;
}

message GetFlightRequest {
  string flight_id = 1;
}

message ReserveSeatsRequest {
  string flight_id = 1;
  int32 seat_count = 2;
  string booking_id = 3;
}

message ReleaseReservationRequest {
  string booking_id = 1;
}

message SeatReservation {
  string id = 1;
  string flight_id = 2;
  string booking_id = 3;
  int32 seat_count = 4;
  ReservationStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
  optional google.protobuf.Timestamp released_at = 7;
}

message UpdateFlightRequest {
  string flight_id = 1;
  string price = 2;
  FlightStatus status = 3;
}
